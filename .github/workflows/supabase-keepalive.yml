name: Supabase keep-alive

# Supabase's free tier pauses a project after ~7 days with no database
# activity. This runs a trivial query on a schedule, well inside that
# window, purely to reset the inactivity clock - bus_explorer connects via
# a direct Postgres connection (see bus_explorer/db.py), not Supabase's
# REST API, so there's no other traffic that would otherwise count.
on:
  schedule:
    - cron: "0 6 */4 * *"  # every 4 days at 06:00 UTC
  workflow_dispatch: {}  # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -c "SELECT 1;"
