<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bus Explorer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🚌 Bus Explorer</a>
    <nav>
      <a href="{{ url_for('index') }}">Explore</a>
      <a href="{{ url_for('what_can_i_do') }}">What Can I Do</a>
      <a href="{{ url_for('my_visits') }}">My Visits</a>
      {% if g.visitor_name %}
        <span class="whoami">Hi, {{ g.visitor_name }} ·
          <a href="{{ url_for('set_name', next=request.full_path) }}">not you?</a>
        </span>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
